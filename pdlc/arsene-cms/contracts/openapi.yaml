openapi: 3.1.0

info:
  title: Arsène CMS API
  version: 1.0.0
  summary: >-
    The four Arsène operations that need server-side atomicity and therefore
    exist as real Supabase Edge Function endpoints, instead of a direct
    PostgREST read/write against a table. Everything else in the writer
    editor (draft field edits/autosave, taxonomy/categories, the asset
    library, alt-text edits, cover/body re-tagging after upload) is a direct
    PostgREST call against Postgres under RLS and is deliberately NOT part of
    this contract — see "What is out of scope" below.
  description: |
    ## What is in scope, and why only four endpoints

    Arsène's writer editor is a single-page app that talks to Postgres
    directly via PostgREST/RLS for nearly everything: autosaving a draft's
    title/body/meta fields once it exists, creating a league or category,
    browsing the shared asset library, and editing an image's `alt_text` or
    `role` after it has been uploaded. None of that needs a bespoke endpoint;
    RLS is the enforcement point and Postgres row shape is the contract.

    Four operations are different, because they have side effects that must
    happen exactly once, atomically, from the server, and cannot be expressed
    as a single-row PostgREST write:

    - `POST /v1/articles` — creates a new draft and takes its edit lock for
      the creating writer in the same call that **synchronously** records the
      `draft_started` telemetry event (spec §4), so the numerator of the
      time-to-publish metric this project exists to prove (spec §3) can never
      be created without also being measured (`02-architecture.v1.md` §9). A
      client-side PostgREST insert followed by a separate client-side
      telemetry write cannot guarantee the second half happens at all — a
      dropped network call or a client bug would silently under-count the
      metric with nothing to detect it.
    - `POST /v1/articles/{articleId}/open` — reopens an existing draft by
      attempting to take its edit lock, or reports who currently holds it
      (AC-05). The lock decision (free/stale vs. actively held) and the
      draft's current content must be resolved together, from the server, in
      one atomic compare-and-swap against `locked_by`/`locked_at`
      (`adr/0003-draft-locking-mechanism.md`) — a client cannot safely
      perform "check who holds it, then maybe take it, then maybe read the
      content" as three separate PostgREST calls without a race between two
      writers opening the same draft at once.
    - `POST /v1/articles/{articleId}/publish` — validates publishability,
      generates the slug/JSON-LD/sitemap entry, flips the article live, and
      **synchronously** records the `article_published` telemetry event
      (spec §4) in the same request that publishes, so the time-to-publish
      metric this project exists to prove (spec §3) can never be published
      without also being measured.
    - `POST /v1/articles/{articleId}/images` — accepts a raw upload, and is
      the one place that must guarantee "no image reaches a writer-visible
      state without going through compression/format-conversion", which a
      raw PostgREST insert into a storage-backed table cannot guarantee.

    ## What is out of scope

    Draft **field** edits (title/body/meta autosave after creation),
    category/league CRUD, lock **heartbeat refresh** by the writer who
    already holds it, alt-text/role edits after upload, and the asset library
    listing are all direct PostgREST operations against Postgres tables (e.g.
    `articles`, `article_images`, `categories`, `leagues`) governed by
    Supabase's auto-generated PostgREST OpenAPI surface and RLS policies.
    That surface is not hand-authored and is not duplicated here; this file
    only covers the four operations above. Draft **creation** and
    **reopening** (taking the lock) are in scope precisely because of the
    atomicity argument above — everything else about a draft, once it exists
    and its lock is held, is not.

    In particular: **alt-text generation** (AC-15) is server-side computation
    that needs the article's own title/content as context, so it happens as
    part of the async pipeline kicked off by `POST .../images` and is
    returned via `alt_text` on that resource once ready (see below).
    **Alt-text editing** by the writer afterward is a trivial single-column
    write with no atomicity requirement, so it is a direct PostgREST
    `PATCH .../article_images?id=eq.{imageId}` under RLS, not a third
    endpoint in this contract. The same is true of moving the `role`
    (cover/body) flag between existing images after upload.

    ## Server-side image processing constraint (implementation note, not a
    contract decision)

    Supabase Edge Functions run on Deno. `sharp`, the library normally used
    on Node for WebP/AVIF conversion and compression, is not usable there
    without a Node compatibility shim, and heavy native image codecs are
    awkward in that runtime generally. This contract does **not** assume
    synchronous, Node-only tooling is available server-side: `POST
    .../images` always returns `201` once the upload itself is accepted, but
    the returned resource's `status` may be `ready` (processing completed
    within the request — plausible for a small file with a fast codec path)
    or `processing` (conversion and alt-text generation are still running,
    e.g. via a queued job, a WASM/Deno-native codec, or a call out to an
    external image-processing service). Callers MUST treat `processing` as
    the common case, not an edge case, and must not block their own UI
    waiting synchronously on `ready`. The eventual `ready`/`failed`
    transition is observed via a direct PostgREST read of the same image row
    (out of scope of this contract — see "What is out of scope"), not via a
    second call into this API. Which of the above implementation strategies
    is actually used is an implementation decision left for the build, not
    fixed by this contract.

    ## Versioning strategy

    Every path here is prefixed with `/v1`, this contract's own semantic
    version — independent of the `/functions/v1/` segment Supabase puts in
    front of every Edge Function URL (see `servers` below).

    - **Non-breaking** (new optional request field, new optional response
      field, a new enum member a client should treat as "unknown, ignore", a
      wholly new endpoint) ships inside `/v1`, no client changes required.
      Clients MUST ignore response fields and enum values they don't
      recognise rather than fail closed — in particular, `ArticleImage.status`
      and `Error.code` are both places a future value may be added
      non-breakingly.
    - **Breaking** (removing/renaming a field, making an optional field
      required, changing a field's type, changing an error `code` a client
      branches on, changing an existing endpoint's URL or method) ships
      under a new `/v2` prefix, as new routes on the same Edge Function or a
      second function, so `/v1` keeps running until every consumer (the
      writer editor SPA) has migrated. No sunset date is fixed here; the
      migration exit criterion is "no more caller depends on `/v1`".
    - Greenfield build: 1.0.0 is the first cut, written before any server
      code exists.

    ## Error envelope

    Every operation can return the `Error` schema on any status code it did
    not explicitly document, via its `default` response, so a consumer
    always has one shape to parse for "something unexpected happened".
    Documented error responses use the same `Error` schema with a specific
    `code` so callers branch on `error.code`, not on `error.message` (human
    wording, not stable) and not on HTTP status alone — several distinct
    problems here legitimately share a status, e.g. `409` covers both
    `IMAGE_NOT_READY` and `DRAFT_LOCKED` on publish, which a writer-facing UI
    must render very differently.

    ## Auth model

    Writers have real Supabase Auth accounts (unlike the sibling `pronos`
    project's account-less players). Every operation below requires a
    Supabase Auth bearer JWT for the calling writer, declared explicitly per
    operation via `security`, never left to a document-level default.
    Because Edge Functions do not automatically inherit PostgREST's RLS the
    way a direct table call does, the function implementing this contract
    must either forward the caller's JWT to its own Supabase client calls (so
    RLS still applies to whatever it reads/writes on the writer's behalf) or
    perform the equivalent authorization check explicitly — this contract
    assumes that happens, but does not itself enforce it.

    There is no separate reviewer/approval role anywhere in this contract:
    per the product spec's out-of-scope section, every writer can publish
    directly.

    ## Pagination

    No operation in this contract returns a list. `POST /v1/articles`
    returns the one draft it just created; `POST .../open` returns the one
    draft it just reopened; `POST .../publish` returns the one article it
    just published; `POST .../images` returns the one image resource it just
    created. No pagination parameters exist here by design — this is not an
    oversight, there is nothing to page. (The writer's list of their own
    drafts is a direct PostgREST `GET /articles?writer_id=eq.{id}` read,
    which does paginate via PostgREST's own `Range`/`Prefer` headers — out of
    scope of this contract, see "What is out of scope".)

    ## Idempotency

    - `POST .../publish`: the state it produces (`published_at`, `slug`,
      `structured_data`, the sitemap entry) is recomputed deterministically
      from the article's current content on every call, so replaying the
      same request converges on the same stored state as long as nothing
      about the article changed between attempts — no client-supplied key
      is required for that part. It does **not** by itself protect the
      synchronous `article_published` telemetry emission from being
      duplicated by a client retry after a timeout. An optional
      `Idempotency-Key` suppresses a second telemetry emission (and only
      that — the returned article state is computed and returned identically
      either way) for a repeat of the same key within a 5-minute window.
    - `POST .../images`: **not** naturally idempotent — every accepted
      call creates a new image row and a new stored object. Uploading a
      multi-MB file over a writer's home connection is exactly the scenario
      where a client cannot know whether a prior attempt already succeeded,
      so `Idempotency-Key` is **required** here. Replaying the same key for
      the same `articleId` within a 24-hour window returns the original
      created resource (whatever its current `status`) unchanged and
      performs no new upload/processing; a different key, or the same key
      against a different `articleId`, is a new request.
    - `POST /v1/articles`: **not** naturally idempotent — every accepted
      call inserts a new `articles` row and emits one `draft_started`
      telemetry event; there is no natural key to deduplicate on (unlike
      publish, nothing about a brand-new draft is deterministic to converge
      on). Deliberately **no** `Idempotency-Key` is offered here, unlike
      publish/upload: a duplicate draft from a retried request is a low-cost
      outcome (one extra, empty, discardable row with a placeholder title —
      not a duplicated multi-MB upload, and not a metric-corrupting duplicate
      telemetry event under a name a client already knows to distinguish),
      so the added complexity of request deduplication was judged not worth
      it for this endpoint in v1. A client unsure whether its create request
      landed should list its own recent drafts (a direct PostgREST read, out
      of scope here) rather than assume failure and blindly retry.
    - `POST .../open`: naturally idempotent **for the writer who already
      holds the lock** — calling it again while holding it re-runs the same
      compare-and-swap (`adr/0003-draft-locking-mechanism.md`), which
      refreshes `locked_at` and returns the same `200` body; safe to retry
      after a timeout with no side effect beyond extending the writer's own
      lock. It is **not** idempotent in effect for a writer who does not hold
      the lock: each call is a fresh attempt whose outcome depends on whether
      the lock is free, stale, or actively held **at that moment** — a `409`
      can legitimately turn into a `200` on retry once the holder's lock goes
      stale, which is correct behaviour, not a bug to guard against. No
      `Idempotency-Key` is needed because re-attempting is always safe with
      the caller's own current intent.

