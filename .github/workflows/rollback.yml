name: Rollback

# A separate workflow, not a job inside deploy.yml, so it's runnable at 3am
# without anyone having to work out a command: fill in the tag, click run.
#   gh workflow run rollback.yml -f tag=v0.1.0
#
# What "rollback" means here, precisely (pdlc/arsene-cms/10-pipeline.v2.md §1):
# every migration in db/migrations/ is expand-only (confirmed for all five —
# 0001-0005 — by inspection and by rehearsal), so rolling back is a CODE
# operation only. The database is never rolled back to an earlier schema —
# Supabase has no PITR/schema rollback on Free/Pro, the same constraint this
# project's sibling pronos already lives with — it only ever moves forward.
# Old code keeps working against the newer (superset) schema by construction,
# which is what makes a code-only rollback safe.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to roll back to (e.g. v0.1.0)"
        required: true

jobs:
  verify-target:
    name: Confirm the rollback target is real and green
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      # A tag that doesn't exist fails the checkout step above immediately,
      # with GitHub's own clear error — no separate check needed.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: npm ci
      - run: npm run setup:contract
      - run: npx tsc --noEmit
      - name: Full suite against the rollback target
        run: npm test

  # The versioned-redeploy rollback ADR-0001/02-architecture.v1.md §6 named
  # for Supabase Edge Functions: `supabase functions deploy` re-uploads the
  # rollback target tag's own checked-out code as the new active version.
  # There is no separate "promote a previous deployment" API to call instead
  # — redeploying the old tag's code *is* the mechanism, the same way the
  # migration job's "rollback" above is "no job, because forward is safe".
  redeploy-api-server:
    name: Redeploy API server at target tag (Supabase Edge Function)
    needs: verify-target
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Redeploy arsene-api at ${{ inputs.tag }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy arsene-api --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}

  # No job for "roll back migrations" — see the header comment. Expand-only
  # discipline means there is nothing to run here; this is stated explicitly,
  # as a deliberate absence, not an oversight.
