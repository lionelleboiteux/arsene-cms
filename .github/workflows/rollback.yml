name: Rollback

# A separate workflow, not a job inside deploy.yml, so it's runnable at 3am
# without anyone having to work out a command: fill in the tag, click run.
#   gh workflow run rollback.yml -f tag=v0.1.0
#
# What "rollback" means here, precisely (pdlc/arsene-cms/10-pipeline.v1.md §2):
# every migration in db/migrations/ is expand-only (confirmed for all five —
# 0001-0005 — by inspection and by rehearsal), so rolling back is a CODE
# operation only. The database is never rolled back to an earlier schema —
# Supabase has no PITR/schema rollback on Free/Pro, the same constraint this
# project's sibling pronos already lives with — it only ever moves forward.
# Old code keeps working against the newer (superset) schema by construction,
# which is what makes a code-only rollback safe.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to roll back to (e.g. v0.1.0)"
        required: true

jobs:
  verify-target:
    name: Confirm the rollback target is real and green
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      # A tag that doesn't exist fails the checkout step above immediately,
      # with GitHub's own clear error — no separate check needed.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - run: npm run setup:contract
      - run: npx tsc --noEmit
      - name: Full suite against the rollback target
        run: npm test

  # BLOCKED — see pdlc/arsene-cms/10-pipeline.v1.md §2, same reason as
  # deploy.yml's deploy-api-server job. Redeploying a previous tag needs a
  # real hosting target to redeploy to; none exists yet for this Node-shaped
  # server on the Deno-shaped runtime the architecture chose.
  redeploy-api-server:
    name: Redeploy API server at target tag (BLOCKED — see 10-pipeline.v1.md §2)
    needs: verify-target
    runs-on: ubuntu-latest
    steps:
      - name: Stop — no real deploy target exists yet
        run: |
          echo "::error::Cannot redeploy: no hosting target is configured for the API server (see pdlc/arsene-cms/10-pipeline.v1.md §2). Once one exists, this job redeploys the given tag's build to it — that redeploy step should be measured for real and the number recorded in a future pipeline-gate pass, the same way scripts/deploy-migrations.sh's timing was."
          exit 1

  # No job for "roll back migrations" — see the header comment. Expand-only
  # discipline means there is nothing to run here; this is stated explicitly,
  # as a deliberate absence, not an oversight.
