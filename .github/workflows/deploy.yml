name: Deploy

# Immutable-artifact discipline: deploy is triggered by a tag, never a moving
# branch reference, so "which version is live" always has one stable answer.
# See pdlc/arsene-cms/10-pipeline.v2.md for the full mechanism and what's been
# rehearsed for real.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to deploy (e.g. v0.1.0). Defaults to the tag that triggered this run."
        required: false

jobs:
  test:
    name: Full test suite (deploy gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # tests/e2e/deployedDenoRuntime.test.ts spawns a real `deno run` process
      # (pdlc/arsene-cms/10-pipeline.v2.md §1) — this suite is genuinely a
      # two-runtime gate now, not just a Node one.
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: npm ci
      - run: npm run setup:contract
      - run: npx tsc --noEmit
      - run: npm test

  deploy-migrations:
    name: Deploy Postgres migrations (Supabase)
    needs: test
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Install postgresql-client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      # scripts/deploy-migrations.sh is idempotent — rehearsed against a real
      # local Postgres for fresh deploy, no-op re-deploy, and incremental
      # deploy (10-pipeline.v1.md §3). It tracks applied migrations in
      # _migrations_applied so re-running this job is always safe.
      - name: Apply pending migrations
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: ./scripts/deploy-migrations.sh

  # `src/api/router.ts` was ported to a transport-agnostic core plus two
  # adapters (pdlc/arsene-cms/10-pipeline.v2.md §1) — this deploys the real
  # Deno one, `supabase/functions/arsene-api/index.ts`, exactly as ADR-0001
  # named. `supabase functions deploy` uploads the function's current code as
  # a new, immutable version; nothing about "which commit is live" is ever
  # ambiguous because this job only ever runs against a tagged commit (the
  # same immutable-artifact discipline as the migration job above).
  deploy-api-server:
    name: Deploy API server (Supabase Edge Function)
    needs: test
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy arsene-api
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy arsene-api --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
